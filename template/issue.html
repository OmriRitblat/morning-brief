<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFE7D3; --paper-edge: #E4D9BF; --ink: #1A1814;
    --muted: #5C5446; --rule: #BFB297; --accent: #23406B;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1C1A16; --paper-edge: #24211C; --ink: #E9E1CD;
      --muted: #A99F8B; --rule: #463F33; --accent: #9DB4D8;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { font-family: "Newsreader", Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.55; }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .book { display: flex; height: 100dvh; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  .book::-webkit-scrollbar { display: none; }
  @media (prefers-reduced-motion: reduce) { .book { scroll-behavior: auto; } }
  .page { flex: 0 0 100%; scroll-snap-align: start; overflow-y: auto; padding: 20px 20px 110px;
    background: linear-gradient(90deg, var(--paper-edge) 0, var(--paper) 14px); }
  .inner { max-width: 720px; margin: 0 auto; }

  .masthead { text-align: center; padding-top: 8px; }
  .masthead h1 { font-family: "UnifrakturMaguntia", "Old English Text MT", serif; font-weight: 400;
    font-size: clamp(44px, 12vw, 84px); line-height: 1; margin: 0 0 10px; }
  .dateline { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink);
    padding: 6px 2px; font-size: 15px; color: var(--muted); }

  .episode { display: flex; align-items: center; gap: 14px; margin: 24px 0; padding: 14px 0;
    border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
  .play { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--ink);
    display: grid; place-items: center; }
  .play svg { width: 18px; height: 18px; margin-left: 3px; fill: currentColor; }
  .episode p { margin: 0; line-height: 1.35; }
  .episode .t { font-weight: 600; }
  .episode .s { color: var(--muted); font-size: 15px; }

  .contents h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .contents ol { list-style: none; padding: 0; margin: 0; }
  .contents li { border-bottom: 1px solid var(--rule); }
  .contents button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 2px; }
  .contents .sec { font-weight: 600; font-size: 19px; }
  .contents .pg { color: var(--muted); font-size: 15px; align-self: center; grid-row: span 2; }
  .contents .hl { color: var(--muted); font-size: 15px; line-height: 1.35; }
  .archive { display: block; margin-top: 18px; font-size: 15px; }

  .folio { display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin-bottom: 18px;
    font-size: 15px; color: var(--muted); }
  .folio strong { font-family: "UnifrakturMaguntia", serif; font-weight: 400; font-size: 22px; color: var(--ink); }

  .lead h2 { font-size: clamp(30px, 7vw, 44px); line-height: 1.08; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.01em; }
  .stand { font-style: italic; font-size: 20px; line-height: 1.4; color: var(--muted); margin: 0 0 16px; }
  .body p { margin: 0 0 12px; text-align: justify; hyphens: auto; }
  @media (min-width: 760px) { .body { column-count: 2; column-gap: 32px; column-rule: 1px solid var(--rule); } }
  .source { font-size: 15px; color: var(--muted); margin-top: 6px; }
  .points { margin: 4px 0 0; padding-left: 20px; }
  .points li { margin-bottom: 8px; }

  .briefs { margin-top: 26px; border-top: 3px double var(--ink); padding-top: 4px; }
  .brief { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .brief h3 { font-size: 21px; line-height: 1.2; margin: 0 0 4px; }
  .brief p { margin: 0; }
  .readlink { display: inline-block; margin-top: 18px; padding: 10px 18px;
    border: 1.5px solid var(--accent); font-weight: 600; text-decoration: none; }

  .study dl { margin: 0; }
  .study dt { font-weight: 700; font-size: 19px; margin-top: 18px; }
  .study dd { margin: 4px 0 0; }
  .numbers { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 16px; }
  .numbers td { border-bottom: 1px solid var(--rule); padding: 6px 0; }
  .numbers td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  details { margin-top: 10px; border: 1px solid var(--rule); padding: 10px 14px; }
  summary { cursor: pointer; font-weight: 600; }

  .turner { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper);
    border-top: 1px solid var(--ink); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
  .turner .row { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .turner button.arrow { flex: none; width: 46px; height: 46px; border: 1px solid var(--rule);
    background: transparent; color: var(--ink); font-size: 22px; cursor: pointer; font-family: inherit; }
  .turner button.arrow:disabled { opacity: .3; cursor: default; }
  .where { flex: 1; text-align: center; line-height: 1.2; }
  .where .name { font-weight: 600; }
  .where .count { font-size: 14px; color: var(--muted); }
  .ticks { display: flex; gap: 4px; justify-content: center; margin-top: 5px; }
  .ticks span { width: 16px; height: 2px; background: var(--rule); }
  .ticks span.on { background: var(--ink); }
</style>
</head>
<body>
<main class="book" id="book" aria-label="Today's issue">
{{PAGES}}
</main>
<nav class="turner" aria-label="Turn pages">
  <div class="row">
    <button class="arrow" id="prev" aria-label="Previous page">‹</button>
    <div class="where">
      <div class="name" id="name"></div>
      <div class="count" id="count"></div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
    </div>
    <button class="arrow" id="next" aria-label="Next page">›</button>
  </div>
</nav>
<script>
  const book = document.getElementById('book');
  const pages = [...book.querySelectorAll('.page')];
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  const nameEl = document.getElementById('name'), countEl = document.getElementById('count');
  const ticks = document.getElementById('ticks');
  pages.forEach(() => ticks.appendChild(document.createElement('span')));
  let current = -1;
  const goTo = i => book.scrollTo({ left: Math.max(0, Math.min(pages.length - 1, i)) * book.clientWidth });
  function update() {
    const i = Math.round(book.scrollLeft / book.clientWidth);
    if (i === current) return;
    current = i;
    nameEl.textContent = pages[i].dataset.name;
    countEl.textContent = `Page ${i + 1} of ${pages.length}`;
    [...ticks.children].forEach((t, k) => t.classList.toggle('on', k === i));
    prev.disabled = i === 0; next.disabled = i === pages.length - 1;
    history.replaceState(null, '', '#p' + (i + 1));
  }
  book.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
  prev.addEventListener('click', () => goTo(current - 1));
  next.addEventListener('click', () => goTo(current + 1));
  document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => goTo(+b.dataset.goto)));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft') goTo(current - 1);
  });
  window.addEventListener('resize', () => book.scrollTo({ left: current * book.clientWidth, behavior: 'auto' }));
  const start = parseInt((location.hash.match(/#p(\d+)/) || [])[1], 10);
  if (start) book.scrollTo({ left: (start - 1) * book.clientWidth, behavior: 'auto' });
  update();
</script>
</body>
</html>
